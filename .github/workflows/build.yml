name: Build Windows exe

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# A branch under review usually gets several pushes in a row, each superseding
# the last. Without this they queue and every stale commit is built in turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # The GUI tests fail as hangs rather than failures when they go wrong: a
    # modal dialog blocks a headless run, and building many windows in one test
    # exhausts the process. Both have happened. A runner sitting on one until
    # the six-hour default is worse than a red build.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Build executable
        run: python -m PyInstaller AutoHotkeyExpansionManager.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutoHotkeyExpansionManager
          path: dist/AutoHotkeyExpansionManager.exe

      - name: Attach exe to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/AutoHotkeyExpansionManager.exe
